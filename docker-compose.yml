version: '3.8'

services:
  # SQL Server Veritabanı
  sql-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ceptesaglik-db
    environment:
      SA_PASSWORD: "HealthApp_Password123!"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - sql-data:/var/opt/mssql

  # .NET Core API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ceptesaglik-api
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      # SQL Server container'ına bağlanmak için connection string'i eziyoruz
      - ConnectionStrings__DefaultConnection=Server=sql-db;Database=HealthAppDb;User Id=sa;Password=HealthApp_Password123!;TrustServerCertificate=True;MultipleActiveResultSets=true
    depends_on:
      - sql-db

volumes:
  sql-data:
